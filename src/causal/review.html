<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAUSAL — Review</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12171f; --panel-2:#161c26; --line:#232c3a;
    --fg:#e6ecf5; --dim:#8b98ab; --faint:#5d6a7d;
    --ok:#3fd68a; --eff:#5aa9ff; --warn:#f5b544; --bad:#ff6b6b; --grey:#6b7889;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
       padding:28px 22px 60px}
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .badge{font:12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);
         color:var(--dim);background:var(--panel)}
  .badge.ok{color:var(--ok);border-color:#20492f}
  .badge.warn{color:var(--warn);border-color:#4a3a12}
  a{color:var(--eff);text-decoration:none}
  a:hover{text-decoration:underline}
  p.lead{color:var(--dim);margin:2px 0 22px;max-width:64ch}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:16px 18px;margin-bottom:14px}
  .job.done{border-left:3px solid var(--ok)}
  .job.waiting{border-left:3px solid var(--warn)}
  .job.stopped{border-left:3px solid var(--bad)}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .head{font-size:16px;font-weight:600;flex:1;min-width:240px}
  .id{font:12px var(--mono);color:var(--faint)}
  ul.effects{list-style:none;margin:12px 0 0;padding:0}
  ul.effects li{display:flex;gap:10px;align-items:baseline;padding:3px 0;
                border-top:1px solid var(--line)}
  ul.effects li:first-child{border-top:0}
  .app{font:12px var(--mono);color:var(--dim);min-width:74px}
  .phrase{flex:1}
  .tick{font:12px var(--mono);color:var(--ok)}
  .tick.warn{color:var(--warn)} .tick.bad{color:var(--bad)}
  .why{color:var(--faint);font-size:13px;margin-top:10px}
  .act{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  input{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);
        border-radius:8px;padding:7px 10px;font:13px var(--mono);width:230px}
  button{background:var(--eff);color:#06101c;border:0;border-radius:8px;padding:8px 15px;
         font:600 13px var(--sans);cursor:pointer}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  pre{margin:12px 0 0;padding:12px;background:#0d1117;border:1px solid var(--line);
      border-radius:8px;font:12px var(--mono);color:var(--dim);overflow-x:auto}
  .hidden{display:none}
  .empty{color:var(--dim);background:var(--panel);border:1px dashed var(--line);
         border-radius:12px;padding:18px}
  footer{margin-top:26px;color:var(--faint);font-size:13px}
</style>
</head>
