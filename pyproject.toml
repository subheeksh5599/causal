[project]
name = "causal"
version = "0.1.0"
description = "An intent-bound execution layer that proves cross-app actions are authorized consequences of one intent."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
filterwarnings = ["ignore::DeprecationWarning"]
